name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wingman_test
          POSTGRES_PASSWORD: wingman_test
          POSTGRES_DB: wingman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wingman_test -d wingman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds core first: the CLI and server type-check against its output.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test Postgres persistence
        run: npm run test:postgres
        env:
          TEST_POSTGRES_CONNECTION_STRING: postgres://wingman_test:wingman_test@localhost:5432/wingman_test

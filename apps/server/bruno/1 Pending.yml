info:
  name: Pending
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/threads/{{threadId}}/pending"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const approvals = res.getBody();
        if (res.status === 200) bru.setVar("approvalId", approvals[0]?.id ?? "");
    - type: tests
      code: |-
        test("200 with a list", () => {
          expect(res.status).to.equal(200);
          expect(res.getBody()).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

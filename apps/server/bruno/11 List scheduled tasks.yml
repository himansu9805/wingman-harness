info:
  name: List scheduled tasks
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/tasks?limit=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lists tasks with their originating threadId, nextRunAt, repeatInterval and state. schedulerEnabled reports whether this server processes jobs. Continue with &cursor=<nextCursor>. Management remains available when scheduling is disabled.

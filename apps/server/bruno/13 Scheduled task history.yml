info:
  name: Scheduled task history
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/tasks/runs?limit=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns bounded execution history independently of task existence. Add &jobId=<taskId> to filter and &cursor=<nextCursor> for another page, preserving the filter. threadId identifies the delivered conversation, including standalone jobs. output/error may be truncated; inspect truncated.

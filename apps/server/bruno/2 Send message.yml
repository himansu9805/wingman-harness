info:
  name: Send message
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/threads/{{threadId}}/messages"
  body:
    type: json
    data: |-
      {
        "message": "run uptime"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 202) bru.setVar("runId", res.getBody().runId);
    - type: tests
      code: |-
        test("accepts a background turn", () => {
          expect(res.status).to.equal(202);
          expect(res.getBody().runId).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

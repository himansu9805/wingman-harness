info:
  name: Deny pending batch
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/threads/{{threadId}}/resume"
  body:
    type: json
    data: |-
      {
        "answers": {{denialAnswers}}
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 202) bru.setVar("runId", res.getBody().runId);
    - type: tests
      code: |-
        test("accepts a background turn", () => {
          expect(res.status).to.equal(202);
          expect(res.getBody().runId).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Run Pending and review every command and execution owner first.
  This POST submits the captured exact batch. Edit the answers JSON for mixed decisions.
  True permits that command; false declines it. The coordinator cannot answer for you.
  Follow Events until the next approval or done/error; repeat Pending for another pause.
  No automatic retry: stale/missing answers are rejected before execution.

info:
  name: History
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/threads/{{threadId}}/messages?limit=50"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", () => {
          expect(res.status).to.equal(200);
          expect(res.getBody().messages).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

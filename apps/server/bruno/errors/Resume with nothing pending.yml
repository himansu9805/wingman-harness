info:
  name: Resume with nothing pending
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/threads/{{threadId}}/resume"
  body:
    type: json
    data: |-
      {
        "answers": { "x": true }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("409", () => {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Run 0 Create thread immediately before this request, before sending a message
  or requesting approvals. A missing thread returns 404, not 409.
